name: Supabase Keepalive

# Supabase pauses free-tier projects after ~7 days of inactivity.
# This pings the REST API every 3 days to keep it awake.

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://jzqinrbkjsnpqynisxye.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set"
            exit 1
          fi

          status=$(curl -sS -o /tmp/response.txt -w '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/likes?select=*&limit=1")

          echo "HTTP $status"
          cat /tmp/response.txt

          if [ "$status" != "200" ]; then
            echo "::error::Keepalive ping failed with HTTP $status"
            exit 1
          fi
